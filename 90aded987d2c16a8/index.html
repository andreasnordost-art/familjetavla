<!--
  Tavla för iPad mini 1 (iOS 6, 1024×768 liggande). Byggs av bygg_ipad.js ur Familjeveckan.

<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { background: #f5f6f3; color: #14211c; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.35; -webkit-text-size-adjust: 100%; -webkit-user-select: none; }
#app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
h2, h3 { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }

/* Överst: klocka, datum, väder */
#top { position: absolute; top: 10px; left: 16px; right: 16px; height: 84px; }
#time { position: absolute; left: 0; top: 0; font-size: 72px; font-weight: bold; letter-spacing: -3px; line-height: 80px; }
#date { position: absolute; left: 210px; top: 14px; font-size: 17px; color: #3c4a44; width: 300px; }
#date b { display: block; font-size: 21px; color: #14211c; }
#date i { font-style: normal; color: #6c7973; font-size: 15px; }
#wx { position: absolute; left: 450px; top: 6px; width: 420px; }
.wx { float: left; width: 204px; margin-right: 6px; height: 72px; overflow: hidden; }
.wx svg { float: left; width: 44px; height: 44px; margin: 4px 8px 0 0; }
.wx span { float: left; width: 150px; font-size: 14px; color: #3c4a44; }
.wx small { display: block; font-size: 11px; font-weight: bold; color: #6c7973; text-transform: uppercase; letter-spacing: 1px; }
.wx b { font-size: 24px; color: #14211c; }
#brand { position: absolute; right: 0; top: 8px; width: 130px; text-align: right; font-size: 12px; color: #6c7973; }
#brand b { display: block; font-size: 15px; color: #14211c; }

/* Tre spalter */
#cols { position: absolute; top: 102px; left: 16px; right: 16px; bottom: 132px; }
.col { position: absolute; top: 0; bottom: 0; background: #fff; border: 1px solid #e0e5e1; border-radius: 16px; overflow: hidden; }
#c1 { left: 0; width: 35%; border: 2px solid #1b2a33; }
#c2 { left: 36%; width: 35%; }
#c3 { left: 72%; right: 0; background: transparent; border: 0; border-radius: 0; }
.head { padding: 12px 16px 4px; }
.head h2 { font-size: 22px; display: inline; }
.head h2 small { font-size: 14px; font-weight: normal; color: #6c7973; margin-left: 6px; }
.chips { margin-top: 4px; }
.chip { display: inline-block; font-size: 12px; font-weight: bold; padding: 2px 7px; border-radius: 6px; background: #edf0ec; color: #3c4a44; margin: 0 4px 2px 0; }
.chip.lov { background: #fdf1dc; color: #93590a; }
.chip.red { background: #fbe9e7; color: #c0352b; }
.list { padding: 0 16px; }
.ev { position: relative; padding: 9px 0 9px 128px; min-height: 22px; border-top: 1px solid #e0e5e1; }
.ev.first { border-top: 0; }
.ev .t { position: absolute; left: 0; top: 9px; width: 52px; font-weight: bold; font-size: 15px; color: #3c4a44; }
.ev .p { position: absolute; left: 56px; top: 10px; width: 70px; font-size: 12px; font-weight: bold; color: #3c4a44; white-space: nowrap; overflow: hidden; }
.ev .x { font-weight: bold; font-size: 16px; }
.ev .x small { display: block; font-weight: normal; color: #6c7973; font-size: 13px; }
.ev.soft .x { font-weight: normal; color: #3c4a44; }
.ev.off .x { color: #93590a; }
.ev.done { opacity: .4; }
.ev.live { background: #e6ebee; margin: 0 -10px; padding-left: 138px; padding-right: 10px; border-radius: 10px; border-top-color: transparent; }
.ev.live .t { left: 10px; }
.ev.live .p { left: 66px; }
.ev.live .t:after { content: "NU"; display: block; font-size: 11px; letter-spacing: 1px; color: #1b2a33; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 5px; margin-right: 5px; vertical-align: 0; }
.tag { display: inline-block; font-size: 11px; font-weight: bold; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
.tag.gym { background: #e3f0ea; color: #2e7a5e; }
.tag.leave { background: #e4ecf7; color: #3a6ea8; }
.empty { color: #6c7973; font-size: 16px; padding: 12px 0; margin: 0; }

/* Sidospalt */
.box { background: #fff; border: 1px solid #e0e5e1; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.box.warn { background: #fdf1dc; border-color: #fdf1dc; }
.box h3 { font-size: 14px; margin-bottom: 4px; }
.box h3 span { float: right; font-weight: normal; color: #6c7973; font-size: 12px; }
.box li { font-size: 14px; padding: 3px 0; }
.box li span { display: block; font-size: 12px; color: #3c4a44; }
.box li.todo { padding-left: 26px; position: relative; }
.box li.todo:before { content: ""; position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border: 2px solid #cbd3ce; border-radius: 4px; }
.box li.todo.ok { color: #6c7973; text-decoration: line-through; }
.box li.todo.ok:before { background: #2e7a5e; border-color: #2e7a5e; }
.sub { font-size: 12px; color: #6c7973; display: block; }
#el b { color: #2e7a5e; font-size: 17px; }

/* Kommande dagar */
#strip { position: absolute; left: 16px; right: 16px; bottom: 50px; height: 72px; }
#strip table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 10px 0; margin: 0 -10px; width: -webkit-calc(100% + 20px); }
#strip td { vertical-align: top; border-top: 2px solid #cbd3ce; padding-top: 6px; overflow: hidden; white-space: nowrap; }
#strip .sd b { font-size: 16px; }
#strip .sd span { color: #6c7973; font-size: 13px; margin-left: 6px; }
#strip .red b, #strip .red .sd span { color: #c0352b; }
#strip .sm { font-size: 13px; color: #3c4a44; margin-top: 3px; }
#strip .sm svg { width: 22px; height: 22px; vertical-align: middle; margin-right: 2px; }
#strip .sm .chip { font-size: 11px; vertical-align: middle; }
#strip .sm .dot { vertical-align: middle; margin: 0 2px 0 4px; }

/* Nyhetsrad */
#news { position: absolute; left: 16px; right: 16px; bottom: 8px; height: 30px; border-top: 1px solid #e0e5e1; padding-top: 8px; white-space: nowrap; overflow: hidden; }
#news .src { font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #1b2a33; margin-right: 10px; }
#news .hl { font-size: 16px; font-weight: bold; -webkit-transition: opacity .4s; }
#news .hl.fade { opacity: 0; }
#news .at { color: #6c7973; font-size: 13px; margin-left: 10px; }

/* Natt 21–06: mörkt och dämpat */
.night body, body.night { background: #000; color: #9aa6a1; }
.night .col, .night .box { background: #111916; border-color: #222d29; }
.night #c1 { border-color: #3c4a44; }
.night #c3 { background: transparent; }
.night #time, .night #date b, .night .wx b, .night #brand b { color: #9aa6a1; }
.night .ev, .night #news, .night #strip td { border-color: #222d29; }
.night #news .hl, .night #news .src { color: #7d8984; }
.night .ev .x, .night .head h2 { color: #9aa6a1; }
.night .ev.live { background: #1b2621; }
.night .box.warn { background: #2a2210; border-color: #2a2210; }
.night .chip { background: #1b2621; }
</style>

var DAYS = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"];

var COLORS = { matheo: "#2e7a5e", malve: "#b0477a", linnea: "#3a6ea8", familj: "#b4741a" };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function two(n) { return (n < 10 ? "0" : "") + n; }
function iso(d) { return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12); }
function fmt(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
function wd(d) { return (d.getDay() + 6) % 7; }
function hm(d) { return two(d.getHours()) + "." + two(d.getMinutes()); }
function who(k) { return NAMES[k] ? k : "familj"; }
function dot(k) { return '<i class="dot" style="background:' + COLORS[who(k)] + '"></i>'; }
function isoWeek(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

// SMHI vädersymboler 1–27 till åtta bilder (samma som Familjeveckan)
function wxKind(s) {
  if (s <= 2) return ["sun", "klart"];
  if (s <= 4) return ["part", "halvklart"];
  if (s <= 6) return ["cloud", "mulet"];
  if (s === 7) return ["fog", "dimma"];
  if (s === 11 || s === 21) return ["storm", "åska"];
  if ([12, 13, 14, 22, 23, 24].indexOf(s) >= 0) return ["sleet", "snöblandat"];
  if ([15, 16, 17, 25, 26, 27].indexOf(s) >= 0) return ["snow", "snö"];
  return ["rain", s === 8 || s === 18 ? "lätt regn" : "regn"];
}
function wxIcon(kind) {
  var SUN = "#d99a00", CL = "#98a39f", RA = "#3a78b5";
  var sun = '<circle cx="12" cy="12" r="5" fill="' + SUN + '"/><g stroke="' + SUN + '" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>';
  function cloud(y) { return '<path transform="translate(0 ' + y + ')" d="M7 19h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.2A3.4 3.4 0 0 0 7 19z" fill="' + CL + '"/>'; }
  var drops = '<g stroke="' + RA + '" stroke-width="2" stroke-linecap="round"><path d="M8 20l-1 2.5M12.5 20l-1 2.5M17 20l-1 2.5"/></g>';
  var flakes = '<g fill="' + RA + '"><circle cx="8" cy="21.5" r="1.3"/><circle cx="12.5" cy="22" r="1.3"/><circle cx="17" cy="21.5" r="1.3"/></g>';
  var parts = {
    sun: sun, cloud: cloud(0),
    part: '<g transform="translate(-3 -4) scale(.8)">' + sun + "</g>" + cloud(1),
    fog: '<g stroke="' + CL + '" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>',
    rain: cloud(-3) + drops,
    storm: cloud(-3) + '<path d="M13 15l-3 5h3l-2 4" stroke="' + SUN + '" stroke-width="2" fill="none" stroke-linejoin="round"/>',
    sleet: cloud(-3) + '<g stroke="' + RA + '" stroke-width="2" stroke-linecap="round"><path d="M8 20l-1 2.5M17 20l-1 2.5"/></g><circle cx="12.5" cy="21.8" r="1.3" fill="' + RA + '"/>',
    snow: cloud(-3) + flakes
  };
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + parts[kind] + "</svg>";
}

function store(k, v) {
  try {
    if (arguments.length > 1) { localStorage.setItem(k, JSON.stringify(v)); return v; }
    var s = localStorage.getItem(k); return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}

function chips(flags) {
  var h = "";
  for (var i = 0; i < (flags || []).length; i++) h += '<span class="chip ' + esc(flags[i][0]) + '">' + esc(flags[i][1]) + "</span>";
  return h;
}

function rowHtml(r, first) {
  var cls = "ev" + (r.c ? " " + r.c : "") + (first ? " first" : "");
  var x = esc(r.x);
  if (r.tag) x += '<span class="tag ' + esc(r.tag[0]) + '">' + esc(r.tag[1]) + "</span>";
  if (r.sub) x += "<small>" + esc(r.sub) + "</small>";
  return '<div class="' + cls + '"' + (r.s ? ' data-s="' + esc(r.s) + '" data-e="' + esc(r.e || "") + '"' : "") + ">" +
    '<span class="t">' + esc(r.t) + "</span>" +
    '<span class="p">' + dot(r.w) + esc(NAMES[who(r.w)]) + "</span>" +
    '<span class="x">' + x + "</span></div>";
}

function fillDay(d, n, label) {
  var key = iso(d), D = T.days[key];
  $("h" + n).innerHTML = esc(label) + "<small>" + DAYS[wd(d)].toLowerCase() + " " + fmt(d) + "</small>";
  if (!D) {
    $("f" + n).innerHTML = "";
    $("l" + n).innerHTML = '<p class="empty">Ingen data för den här dagen än. Den kommer när tavlan uppdateras.</p>';
    return;
  }
  $("f" + n).innerHTML = chips(D.flags);
  var h = "";
  for (var i = 0; i < D.rows.length; i++) h += rowHtml(D.rows[i], i === 0);
  $("l" + n).innerHTML = h || '<p class="empty">Inget inplanerat.</p>';
}

function draw() {
  var now = new Date(), today = iso(now), tm = addDays(now, 1), D0 = T.days[today];
  var names = (D0 && D0.names && D0.names.length) ? '<i> · Namnsdag: ' + esc(D0.names.join(", ")) + "</i>" : "";
  $("date").innerHTML = "<b>" + DAYS[wd(now)] + " " + fmt(now) + "</b>Vecka " + isoWeek(now) + names;
  $("built").innerHTML = T.built ? "Uppdaterad " + esc(T.built.slice(8, 10).replace(/^0/, "") + "/" + Number(T.built.slice(5, 7)) + " " + T.built.slice(11)) : "";

  fillDay(now, 1, "Idag");
  fillDay(tm, 2, "Imorgon");

  // Väder idag och imorgon
  var wh = "", pair = [[today, "Idag"], [iso(tm), "Imorgon"]];
  for (var k = 0; k < 2; k++) {
    var dd = T.days[pair[k][0]], w = dd && dd.wx;
    if (!w) continue;
    var kind = wxKind(w.sym);
    wh += '<div class="wx">' + wxIcon(kind[0]) + "<span><small>" + pair[k][1] + "</small><b>" + w.max + "°</b> " + w.min + "° · " + kind[1] +
      (w.rain >= 0.5 ? ", " + String(w.rain).replace(".", ",") + " mm" : "") + "</span></div>";
  }
  $("wx").innerHTML = wh;

  // Att hålla koll på: lov och stängning idag/imorgon och veckans viktiga saker
  var attn = [], seen = {};
  for (var j = 0; j < T.closures.length; j++) {
    var c = T.closures[j];
    for (var q = 0; q < 2; q++) {
      var day = q ? iso(tm) : today, dow = wd(q ? tm : now);
      if (dow < 5 && c.from <= day && day <= c.to) {
        var txt = c.name + ": " + c.label + (c.time ? ", hämta senast " + c.time : "");
        if (!seen[txt]) { seen[txt] = 1; attn.push([txt, q ? "Imorgon" : "Idag"]); }
      }
    }
  }
  var W = D0 && T.weeks[D0.wk];
  if (W) for (var a = 0; a < W.alerts.length; a++) attn.push([W.alerts[a], "Den här veckan"]);
  var ah = "";
  for (var b = 0; b < attn.length; b++) ah += "<li><b>" + esc(attn[b][0]) + "</b><span>" + esc(attn[b][1]) + "</span></li>";
  $("attn").innerHTML = ah;
  $("attn-box").style.display = attn.length ? "" : "none";

  // Lunch
  var m = D0 ? D0.lunch.m : [], v = D0 ? D0.lunch.v : [];
  var lh = (m.length || v.length) ? "<div>" + esc(m[0] || v[0]) + "</div>" : '<span class="sub">Ingen skollunch idag.</span>';
  if (v.length && m.length && v[0] !== m[0]) lh += '<span class="sub">Malve: ' + esc(v[0]) + "</span>";
  if (m.length > 1) lh += '<span class="sub">Även: ' + esc(m.slice(1).join(" · ")) + "</span>";
  $("lunch").innerHTML = lh;

  // Att göra. Bockarna sparas på iPaden.
  drawTodos(D0);

  // Elpris idag
  var E = null;
  for (var e = 0; e < T.el.length; e++) if (T.el[e].date === today) E = T.el[e];
  $("el-box").style.display = E ? "" : "none";
  if (E) $("el").innerHTML = "<b>kl. " + two(E.from) + "–" + two(E.to) + "</b> · snitt " + E.w + " öre <span class=\"sub\">Dagens snitt " + E.avg + " öre/kWh</span>";

  // Trafik, bara när något är på gång
  var th = "";
  for (var r = 0; r < T.traffic.length; r++) th += "<li>" + esc(T.traffic[r]) + "</li>";
  $("tr").innerHTML = th;
  $("tr-box").style.display = th ? "" : "none";

  // Fem dagar efter imorgon
  var sh = "<table><tr>";
  for (var s = 2; s <= 6; s++) {
    var d = addDays(now, s), key = iso(d), i = wd(d), P = T.days[key];
    sh += '<td class="' + ((P && P.red) || i === 6 ? "red" : "") + '"><div class="sd"><b>' + DAYS[i] + "</b><span>" + fmt(d) + '</span></div><div class="sm">';
    if (P) {
      if (P.wx) sh += wxIcon(wxKind(P.wx.sym)[0]) + "<span>" + P.wx.max + "°</span>";
      var ppl = {}, order = [];
      for (var z = 0; z < P.rows.length; z++) {
        var rw = P.rows[z];
        if (rw.c === "soft" || rw.c === "off") continue;
        var wk = who(rw.w);
        if (!ppl[wk]) { ppl[wk] = 1; order.push(wk); }
      }
      for (var o = 0; o < order.length; o++) sh += dot(order[o]);
      sh += " " + chips(P.flags);
    } else sh += "Ingen data än";
    sh += "</div></td>";
  }
  $("strip").innerHTML = sh + "</tr></table>";
  tick();
}

function drawTodos(D0) {
  var W = D0 && T.weeks[D0.wk], list = W ? W.todos : [];
  var KEY = "tavla-v" + (D0 ? D0.wk : 0), done = store(KEY) || {};
  var h = "";
  for (var i = 0; i < list.length; i++) h += '<li class="todo' + (done[i] ? " ok" : "") + '" data-i="' + i + '">' + esc(list[i]) + "</li>";
  $("todos").innerHTML = h;
  $("todo-box").style.display = list.length ? "" : "none";
  var n = 0; for (var k in done) if (done[k]) n++;
  $("todo-n").innerHTML = list.length ? n + " av " + list.length : "";
  $("todos").onclick = function (ev) {
    var li = ev.target; while (li && li.nodeName !== "LI") li = li.parentNode;
    if (!li) return;
    var ix = li.getAttribute("data-i"); done[ix] = !done[ix]; store(KEY, done); drawTodos(D0);
  };
}

// Klocka, nu/klart-markering och nattläge
function tick() {
  var now = new Date(), t = hm(now), h = now.getHours();
  $("time").innerHTML = t;
  document.documentElement.className = (h >= 21 || h < 6) ? "night" : "";
  var rows = $("l1").getElementsByTagName("div");
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], s = r.getAttribute("data-s");
    if (!s) continue;
    var e = r.getAttribute("data-e") || "", base = r.className.replace(/ ?(live|done)\b/g, "");
    var live = s <= t && t < (e || "99"), done = !live && (e || s) < t;
    r.className = base + (live ? " live" : done ? " done" : "");
  }
}

// En nyhetsrubrik i taget, byts var tolfte sekund
var newsAt = 0;
function news() {
  if (!T.news.length) { $("news").style.display = "none"; return; }
  var n = T.news[newsAt % T.news.length], hl = $("nhl");
  hl.className = "hl fade";
  setTimeout(function () {
    $("nsrc").innerHTML = esc(n.src); hl.innerHTML = esc(n.t);
    var d = n.at ? n.at.slice(0, 10) : "";
    $("nat").innerHTML = n.at ? (d === iso(new Date()) ? "" : Number(d.slice(8)) + "/" + Number(d.slice(5, 7)) + " ") + n.at.slice(11, 16).replace(":", ".") : "";
    hl.className = "hl"; newsAt++;
  }, newsAt ? 400 : 0);
}

// Hämta ny version från servern. Laddar bara om när servern svarar, så att tavlan aldrig blir en felsida.
function refresh() {
  if (location.protocol === "file:") return;
  try {
    var x = new XMLHttpRequest();
    x.open("GET", location.pathname + "?t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200 && x.responseText.indexOf("var T = ") > 0) location.reload();
    };
    x.send();
  } catch (e) {}
}

var loadDay = iso(new Date());
draw(); news();
setInterval(function () { if (iso(new Date()) !== loadDay) { loadDay = iso(new Date()); draw(); } else tick(); }, 20000);
setInterval(news, 12000);
setInterval(refresh, 30 * 60 * 1000);
</script>
